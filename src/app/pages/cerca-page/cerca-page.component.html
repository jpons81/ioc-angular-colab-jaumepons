<app-formulari-cerca (cerca)="ferCerca($event)"></app-formulari-cerca>

<!-- 🔄 Estat inicial: mostra spinner mentre no hi ha terme -->
<div *ngIf="!serveiService.termeCerca()" class="estat">
  <div class="spinner"></div>
  <p>Escriu a la cerca per trobar el que busques</p>
</div>

<div *ngIf="serveiService.error()" class="error">
  <p>{{ serveiService.error() }}</p>
</div>

<div
  *ngIf="
    serveiService.termeCerca() &&
    !serveiService.carregant() &&
    serveiService.serveis().length === 0
  "
  class="error"
>
  <p>No s'han trobat resultats per aquest terme.</p>
</div>

<div class="grid">
  <app-servei-card
    *ngFor="let servei of serveiService.serveis()"
    [servei]="servei"
  >
  </app-servei-card>
</div>
