<div *ngIf="servei() as s; else noTrobat" class="detall-container">
  <h2 class="titol">{{ s.serveiSolicitat }}</h2>
  <h3 class="subtitol">{{ s.descripcio }}</h3>

  <div class="info">
    <p><strong>Servei ofert:</strong> {{ s.serveiOfert }}</p>
    <p><strong>Ubicació:</strong> {{ s.ubicacio }}</p>
    <p><strong>Categoria:</strong> {{ s.categoriaOfertada }}</p>
  </div>
</div>

<ng-template #noTrobat>
  <p class="no-trobat">El servei no existeix.</p>
</ng-template>
