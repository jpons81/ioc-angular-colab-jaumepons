<div class="panell-preferits">
  <h3>Preferits ({{ preferitsService.totalPreferits() }})</h3>

  <div *ngIf="preferits && preferits.length > 0">
    <div *ngFor="let servei of preferits">
      <h4>{{ servei.serveiSolicitat }}</h4>

      <!-- 🔥 SOLUCIÓ DEFINITIVA -->
      <div
        class="notes"
        *ngIf="formularis[servei.id] as formArray; else carregantFormulari"
      >
        <div
          *ngFor="let notaCtrl of formArray.controls; let i = index"
          class="nota-item"
        >
          <input
            type="text"
            [formControl]="notaCtrl"
            (blur)="guardarNotes(servei.id)"
          />

          <button class="eliminar" (click)="eliminarNota(servei.id, i)">
            x
          </button>

          <div class="error" *ngIf="notaCtrl.invalid && notaCtrl.touched">
            La nota ha de tenir mínim 3 caràcters.
          </div>
        </div>

        <button class="afegir" (click)="afegirNota(servei.id)">
          + Afegir nota
        </button>
      </div>

      <ng-template #carregantFormulari>
        <p style="font-size: 12px; color: #888">Carregant formulari...</p>
      </ng-template>
    </div>
  </div>

  <p *ngIf="preferitsService.totalPreferits() === 0" class="buit">
    Encara no hi ha preferits.
  </p>
</div>
