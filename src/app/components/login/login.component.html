<div class="login-wrapper">
  <div class="login-box">
    <h2>Iniciar sessió</h2>

    <form (ngSubmit)="login()">
      <label>
        Email:
        <input type="email" [(ngModel)]="email" name="email" required />
      </label>

      <label>
        Contrasenya:
        <input
          type="password"
          [(ngModel)]="contrasenya"
          name="contrasenya"
          required
        />
      </label>

      <button type="submit">Entrar</button>

      <p *ngIf="error" class="error">Credencials incorrectes</p>
    </form>
  </div>
</div>
